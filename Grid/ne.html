<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="grid-container">
        <div class="header">Header</div>
        <div class="sidebar">Sidebar</div>
        <div class="content">Konten</div>
        <div class="footer">Footer</div>
    </div>

    <style>
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 3fr;
            /* Sidebar mengambil 1 bagian, konten mengambil 3 */
            grid-template-rows: auto 1fr auto;
            /* Header dan footer ukuran otomatis */
        }

        .header {
            grid-column: 1 / 3;
            /* Header mengisi dua kolom */
        }

        .sidebar {
            grid-column: 1;
        }

        .content {
            grid-column: 2;
        }

        .footer {
            grid-column: 1 / 3;
            /* Footer mengisi dua kolom */
        }
    </style>

</body>

</html>
